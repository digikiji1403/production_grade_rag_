
# A generic, single database configuration.

[alembic]
# Path to migration scripts.
script_location = %(here)s/backend/alembic

# Template used to generate migration file names.
# Default: %%(rev)s_%%(slug)s
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Python import path.
prepend_sys_path = .

# Path separator for lists of paths.
path_separator = os

# Database URL is loaded securely from .env in backend/alembic/env.py.
# Do not put database credentials in this file.
sqlalchemy.url =


[post_write_hooks]
# Optional formatting and linting hooks can be configured here.


# Logging configuration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
